# ColaNasOs 产品站（cola.gexuan.net）
#
# 域名：cola.gexuan.net（gexuan.net 子域，A 记录 → 106.54.217.61，由阿里云 DNS 管理）
# 证书：acme.sh（阿里云 DNS-01）签发，/etc/nginx/ssl/cola.gexuan.net/，cron 自动续期
#
# 安装位置：/etc/nginx/sites-available/swim-cola（软链到 sites-enabled/swim-cola）
# 站点根目录：/srv/cola/www（部署源：/srv/cola/deploy/）
#
# ⚠️ 不要设为 default_server：swim-blog（www.gexuan.net）占着 80/443 默认站，
#    本配置用 server_name 精确匹配 cola.gexuan.net，与同机其它站点互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name cola.gexuan.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cola.gexuan.net;

    ssl_certificate     /etc/nginx/ssl/cola.gexuan.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cola.gexuan.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /srv/cola/www;
    index index.html;

    client_max_body_size 24m;

    access_log /var/log/nginx/swim-cola.access.log;
    error_log  /var/log/nginx/swim-cola.error.log warn;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---------- 静态页 ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 单页里的锚点不产生额外文件，404 直接回首页更友好
    error_page 404 /index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        access_log off;
    }
}
