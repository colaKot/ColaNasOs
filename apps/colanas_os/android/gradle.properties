org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# G: 盘上多模块并行编译 Kotlin 时，增量缓存偶发 "Could not close incremental caches"
# （两个插件模块同时报同一个错），关掉增量换稳定。
kotlin.incremental=false
# 本机构建代理：127.0.0.1:21578（实测 8.4MB/s）
# 不带代理直连 dl.google.com / storage.googleapis.com 会卡在 Downloading 不动
# （实测 CPU 100 秒只走 0.8 秒）。改完必须 ./gradlew --stop，daemon 不热读这些属性。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=21578
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=21578
systemProp.https.nonProxyHosts=localhost|127.0.0.1|[::1]
