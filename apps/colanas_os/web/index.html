<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ColaNasOs - NAS 一体化客户端">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ColaNasOs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon
       换图标时把 ?v=N 的 N 加一：Chrome 对 favicon 的缓存非常顽固，
       同 URL 换了文件也不会刷新，带上版本串才会重新取。 -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>ColaNasOs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    canvaskit 与回退字体都在 `web/flutter_bootstrap.js` 里配置成走本地：
      - canvaskit -> `canvaskit/`（默认会去 gstatic CDN，内网/无外网时取不到，
        loader 拿不到引擎就只剩白屏）；
      - 字体 -> `fonts_fallback/s/**`（由 `tool/fetch-fallback-fonts.js` 从 Flutter
        SDK 的 Noto 分片镜像而来，避免汉字渲染成「方块里一个 X」）。
    不要在 index.html 里改写 `window._flutter`：bootstrap 会复用已存在的
    `_flutter.loader`，劫持后真正的 loader 永远不会被创建，页面同样白屏。
  -->
  <!--
    旧版本用默认 bootstrap 注册过 service worker，它会把旧产物缓存下来，
    导致内核重启后浏览器仍拿到过期页面（同样是白屏）。现在明确不再注册 SW，
    顺手把历史注册与缓存清掉。
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.unregister();
        });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }
  </script>
  <!--
    右键交给应用自己的菜单（相册 / 文件 / 音乐 / 影视都有右键菜单）。
    浏览器默认菜单会盖住 Flutter 画出来的菜单，所以默认拦掉；
    输入框与文本域保留默认行为，否则右键粘贴、拼写检查都没了。
  -->
  <script>
    window.addEventListener(
      'contextmenu',
      function (e) {
        var t = e.target;
        var tag = t && t.tagName ? t.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (t && t.isContentEditable) return;
        e.preventDefault();
      },
      true,
    );
  </script>
  <!--
    强制 m3u8 交给 hls.js，别让 Chromium 自己接。

    播放器内核是 media_kit，它 Web 端选播放方式的判定（`_isHLS`）第一句是
    「只要 `canPlayType('application/vnd.apple.mpegurl')` 非空就认为浏览器原生
    能解 HLS，直接 return false」。Chrome 早期对 mpegurl 返回空串，所以以前一直
    走 hls.js；Chromium 156 起改成返回 `maybe`（实测
    `HeadlessChrome/156.0.0.0` → `maybe`），于是 hls.js 再也不挂上去，
    `element.src` 直接指向 `index.m3u8`，落到 Chromium 自己的 HLS 实现上。

    后果是转码出来的 EVENT 播放列表被当成直播：`video.duration` 变成 `Infinity`、
    进度条拖不动；换个片源/分段稍有不同就报
    `PipelineStatus::DEMUXER_ERROR_COULD_NOT_PARSE`。同一地址交给 hls.js 则是
    `MANIFEST_PARSED / LEVEL_LOADED / FRAG_LOADED` 全部正常、时长可读。

    所以在 Chromium 系（Chrome / Edge / Electron）把 mpegurl 这一项抹成空串，
    让 media_kit 的判定回到「走 hls.js」。Safari / iOS 的原生 HLS 是真的能用，
    不动（UA 里没有 Chrome/）。
  -->
  <script>
    (function () {
      if (!/Chrome\/|Chromium\/|Edg\//.test(navigator.userAgent)) return;
      var proto = window.HTMLMediaElement && window.HTMLMediaElement.prototype;
      if (!proto || !proto.canPlayType) return;
      var original = proto.canPlayType;
      proto.canPlayType = function (type) {
        if (String(type || '').toLowerCase().indexOf('mpegurl') >= 0) return '';
        return original.call(this, type);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
